version: 2

models:
  - name: stg_telemetry_events
    description: Clean, typed, one-row-per-event telemetry.
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: machine_id
        tests: [not_null]
      - name: line_id
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              values: ["healthy", "warning", "critical"]
